[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "securepay-seed"
version = "0.1.0"
description = "Database seed and ETL datasets for SecurePay (F4)"
requires-python = ">=3.12"
dependencies = [
    "securepay-shared>=0.1.0",
    "faker>=40.43.0",
    "python-dotenv>=1.2.4",
    "boto3>=1.43.113",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["seed", "datasets"]
